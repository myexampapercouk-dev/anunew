<style>
  :root{
    --bg:#FFFFFF;           /* white field, where reading happens */
    --panel:#F5F7FB;        /* light card */
    --tint:#EDF1F8;         /* pale blue, the third tone, for soft breaks */
    --ink:#151A22;          /* near-black text on light */
    --muted:#5B6472;        /* secondary on light */
    --faint:#949AA6;        /* tertiary on light */
    --line:#E7E9EF;         /* hairline on light */
    --line-2:#D3D8E1;
    --navy:#0B2A52;         /* brand anchor: logo, feature blocks, buttons, lead bars */
    --navy-soft:#1C3E72;    /* navy hover */
    --onnavy:#FFFFFF;       /* text on navy */
    --onnavy-mut:#A9B6D0;   /* muted text on navy */
    --bar-soft:#C3CEE0;     /* non-lead data bars */
    --maxw:1080px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(66px + env(safe-area-inset-top,0px))}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-weight:400;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;cursor:pointer}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}

  header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:66px;gap:24px}
  .brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
  .brand .brandlogo{height:26px;flex:none;display:block}
  .brand .nm{font-size:19px;font-weight:500;letter-spacing:-.02em}
  nav.main{display:flex;align-items:center;gap:4px}
  nav.main .navitem{position:relative}
  nav.main button.nav,nav.main a.nav{display:flex;align-items:center;gap:5px;padding:8px 13px;font-size:14px;font-weight:450;color:var(--muted);border-radius:3px}
  nav.main button.nav:hover,nav.main a.nav:hover{color:var(--navy)}
  nav.main .nav .car{font-size:8px;color:var(--faint);transform:translateY(1px)}
  .dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:184px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 34px rgba(16,38,69,.12);padding:6px;display:none}
  .navitem.open .dropdown{display:block}
  .dropdown a{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;font-size:13.5px;color:var(--muted);border-radius:4px}
  .dropdown a:hover{background:var(--tint);color:var(--navy)}
  .dropdown a .co{font-size:10.5px;color:var(--faint)}
  .briefing-btn{background:var(--navy);color:#fff;padding:9px 17px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
  .briefing-btn:hover{background:var(--navy-soft)}
  .menu-toggle{display:none;font-size:14px;font-weight:450;color:var(--muted)}

  .tagline{display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;font-size:12.5px}
  .tag-beat{color:var(--navy);font-weight:600}
  .tag-cor{color:var(--faint)}
  .tag-cor a:hover{color:var(--navy)}
  .tag-cor .dot{margin:0 5px;color:var(--line-2)}
  .kindtag{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .meta{font-size:12.5px;color:var(--faint)}
  .sec-lbl{font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);margin-bottom:20px}

  .home-hero{padding:64px 0 0}
  .lead{display:grid;grid-template-columns:1.35fr .65fr;gap:56px;padding:0 0 60px;border-bottom:1px solid var(--line);align-items:start}
  .lead .kindtag{margin-bottom:22px;display:block}
  .lead h1{font-weight:400;letter-spacing:-.025em;line-height:1.04;font-size:clamp(33px,5.2vw,62px);margin:0 0 26px;cursor:pointer;max-width:16ch}
  .lead h1:hover{color:var(--navy)}
  .lead .sf{font-size:clamp(16px,1.6vw,19px);color:var(--muted);line-height:1.5;margin:0 0 26px;max-width:46ch}
  .lead .l-side{padding-top:8px}
  .lead .l-side .subhead{font-size:12px;color:var(--faint);margin:0 0 20px;display:flex;justify-content:space-between}
  .lead .l-side .subhead a:hover{color:var(--navy)}
  .side-item{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line);cursor:pointer}
  .side-item:last-child{border-bottom:0;margin-bottom:0}
  .side-item:hover h4{color:var(--navy)}
  .side-item h4{font-weight:450;font-size:15.5px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
  .side-item .st{font-size:12px;color:var(--faint)}

  /* navy feature block */
  .briefing{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:38px 36px;margin:52px 0;display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
  .briefing .bt h3{font-weight:450;font-size:clamp(20px,2.4vw,27px);letter-spacing:-.02em;margin:0 0 8px;color:#fff}
  .briefing .bt p{margin:0;color:var(--onnavy-mut);font-size:15px;max-width:52ch}
  .briefing .form{display:flex;gap:10px;flex:none}
  .briefing input{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:12px 18px;font-size:14px;width:236px;font-family:inherit}
  .briefing input::placeholder{color:var(--onnavy-mut)}
  .briefing input:focus{border-color:#fff;outline:none}
  .briefing .go{background:#fff;color:var(--navy);font-weight:600;font-size:14px;padding:12px 22px;border-radius:999px}
  .briefing .go:hover{opacity:.9}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:56px 0 10px}
  .sec-head .lbl{font-size:13px;font-weight:600;color:var(--navy)}
  .sec-head .count,.sec-head .count a{font-size:12.5px;color:var(--faint)}
  .sec-head .count a:hover{color:var(--navy)}

  .row{display:grid;grid-template-columns:1fr auto;gap:32px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
  .row .r-body{min-width:0}
  .row .tagline{margin-bottom:11px}
  .row h3{font-weight:450;font-size:clamp(19px,2.2vw,26px);line-height:1.15;margin:0 0 9px;letter-spacing:-.02em;cursor:pointer}
  .row h3:hover{color:var(--navy)}
  .row .sf{color:var(--muted);font-size:14.5px;margin:0;max-width:66ch;line-height:1.5}
  .row .r-meta{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap;padding-top:4px}

  .thisweek{border:1px solid var(--line);border-radius:12px;padding:32px 34px;background:var(--tint);margin-top:8px}
  .tw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .tw-head h3{font-weight:450;font-size:clamp(21px,2.5vw,28px);letter-spacing:-.02em;margin:0}
  .tw-sub{color:var(--muted);font-size:14px;margin:6px 0 0}
  .tw-badge{font-size:12px;color:var(--navy);border:1px solid var(--navy);padding:5px 11px;border-radius:999px;white-space:nowrap;font-weight:500}
  .tw-list{list-style:none;margin:22px 0 0;padding:0}
  .tw-item{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-2);align-items:baseline;cursor:pointer}
  .tw-item:last-child{border-bottom:0}
  .tw-item:hover h5{color:var(--navy)}
  .tw-num{font-size:12.5px;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:2px;font-weight:500}
  .tw-item h5{font-weight:450;font-size:16.5px;line-height:1.3;margin:0;letter-spacing:-.01em}
  .tw-tags{font-size:12px;color:var(--faint);margin-top:4px}
  .tw-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px;padding-top:22px;border-top:1px solid var(--line-2)}
  .tw-cta-form{display:flex;gap:9px}
  .tw-cta-form input{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:11px 16px;font-size:13.5px;width:210px;font-family:inherit;color:var(--ink)}
  .tw-cta-form input:focus{border-color:var(--navy);outline:none}
  .tw-cta-form .go{background:var(--navy);color:#fff;font-weight:500;font-size:13.5px;padding:11px 18px;border-radius:999px}
  .tw-cta-form .go:hover{background:var(--navy-soft)}
  .tw-all{font-size:14px;color:var(--navy);border-bottom:1px solid var(--navy);padding-bottom:2px;white-space:nowrap;font-weight:500}
  .tw-all:hover{opacity:.7}

  .corridors-block{padding:64px 0 20px}
  .corridors-block .lbl{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:26px}
  .cor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
  .cor-cell{background:var(--bg);padding:26px 24px 30px;cursor:pointer;transition:background .18s}
  .cor-cell:hover{background:var(--tint)}
  .cor-cell .cname{font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--navy)}
  .cor-cell .cmeta{font-size:12.5px;color:var(--faint);margin-top:10px}

  .listing-head{padding:56px 0 6px}
  .listing-head .crumb{font-size:12.5px;color:var(--faint);margin-bottom:16px}
  .listing-head .crumb a:hover{color:var(--navy)}
  .listing-head h2{font-weight:400;font-size:clamp(30px,4.6vw,52px);letter-spacing:-.03em;margin:0;line-height:1.04}
  .listing-head .desc{color:var(--muted);font-size:16px;margin:14px 0 0;max-width:60ch;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
  .chip{font-size:13px;color:var(--muted);border:1px solid var(--line-2);padding:7px 14px;border-radius:999px;font-weight:450}
  .chip:hover{border-color:var(--navy);color:var(--navy)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

  .tracker-list{margin-top:10px}
  .trackrow{display:grid;grid-template-columns:70px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .trackrow .tdate{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
  .trackrow .thead{font-weight:450;font-size:17.5px;line-height:1.28;letter-spacing:-.015em}
  .trackrow .tmeta{font-size:12.5px;color:var(--faint);margin-top:6px}
  .tracker-foot{padding:26px 0 0;font-size:13px;color:var(--faint)}

  .cpage{padding-top:0}
  .chead{padding:36px 0 0}
  .chead .crumb{font-size:12.5px;color:var(--faint)}
  .chead .crumb a:hover{color:var(--navy)}
  .ctitle{font-weight:400;font-size:clamp(36px,6vw,66px);letter-spacing:-.03em;margin:14px 0 0;line-height:1.02}
  .cstand{font-size:clamp(16px,1.9vw,21px);color:var(--muted);max-width:62ch;margin:18px 0 0;line-height:1.45}

  /* corridor numbers: navy data panel = strong visual break */
  .numbers{margin:46px 0 0}
  .ngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden;background-color:var(--navy)}
  .ncell{background:var(--navy);padding:24px 20px 22px}
  .ncell .big{font-size:clamp(22px,2.9vw,31px);font-weight:500;letter-spacing:-.02em;line-height:1;color:#fff}
  .ncell .lbl{font-size:13px;color:var(--onnavy-mut);margin-top:10px;line-height:1.35}
  .ncell .src{font-size:10.5px;color:#7C8AAB;margin-top:9px}

  .flow{margin:40px 0 0}
  .destrow{padding:16px 0;border-bottom:1px solid var(--line)}
  .destrow .toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .destrow .name{font-size:17px;font-weight:500}
  .destrow.lead .name{font-weight:600}
  .destrow .role{font-size:11.5px;color:var(--faint);margin-left:10px;font-weight:400}
  .destrow .val{font-size:14px;color:var(--muted);white-space:nowrap}
  .destrow .bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
  .destrow .fill{height:100%;background:var(--bar-soft);border-radius:3px}
  .destrow.lead .fill{background:var(--navy)}
  .destrow .detail{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.55;max-width:74ch}
  .destrow .detail b{color:var(--ink);font-weight:600}
  .flow .fsrc{font-size:11px;color:var(--faint);margin-top:16px}
  .flow .prose{font-size:14.5px;color:var(--muted);line-height:1.6;max-width:74ch;margin-top:4px}
  .flow .prose b{color:var(--ink);font-weight:600}

  .lists{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:40px}
  .lcol{background:var(--panel);padding:24px 22px}
  .lcol h4{font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--navy);margin:0 0 16px}
  .litem{padding:11px 0;border-bottom:1px solid var(--line-2)}
  .litem:last-child{border-bottom:0}
  .litem .nm{font-size:16px;font-weight:500}
  .litem .d{font-size:13px;color:var(--muted);margin-top:3px}

  .cprofile{margin:52px 0 0;border-top:2px solid var(--navy)}
  .cprofile .sec-lbl{margin:22px 0 0}
  .prow{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .prow .k{font-size:12.5px;color:var(--faint);letter-spacing:.02em;text-transform:uppercase}
  .prow .v{font-size:16.5px;line-height:1.5;max-width:66ch}
  .prow .v b{font-weight:600}
  .prow.risk .k{color:#B07515}
  .prow.struct .k{color:var(--navy)}

  .cempty{padding:30px 0 8px;max-width:60ch}
  .cempty h3{font-weight:450;font-size:22px;letter-spacing:-.02em;margin:0 0 10px}
  .cempty p{color:var(--muted);font-size:15px;margin:0;line-height:1.55}

  .csources{margin:44px 0 0;padding:22px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.6}
  .csources b{color:var(--muted);font-weight:600}

  .empty{padding:64px 0;max-width:56ch}
  .empty h3{font-weight:450;font-size:25px;letter-spacing:-.02em;margin:0 0 12px}
  .empty p{color:var(--muted);font-size:15.5px;margin:0 0 20px;line-height:1.55}
  .empty .act{font-size:14px;color:var(--navy);border-bottom:1px solid var(--navy);padding-bottom:2px;font-weight:500}

  .read{max-width:660px;margin:0 auto;padding:56px 0 20px}
  .read .back{font-size:13px;color:var(--muted);margin-bottom:34px;display:inline-block}
  .read .back:hover{color:var(--navy)}
  .read .kindtag{display:block;margin-bottom:20px}
  .read h1{font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.07;letter-spacing:-.03em;margin:0 0 22px}
  .read .sf{font-size:20px;color:var(--muted);line-height:1.46;margin:0 0 30px}
  .read .abyline{font-size:12.5px;color:var(--faint);padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:36px}
  .read .body p{font-size:18px;line-height:1.66;margin:0 0 24px;letter-spacing:-.003em}
  .read .tags-foot{margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}

  /* navy footer bookend */
  footer{background:var(--navy);color:var(--onnavy-mut);padding:52px 0 64px;margin-top:56px;font-size:13px}
  footer .flogo{height:26px;display:block;margin-bottom:22px;opacity:.95}
  footer .frow{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px}
  footer a:hover{color:#fff}

  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

  @media(max-width:820px){
    .wrap{padding:0 20px}
    .lead{grid-template-columns:1fr;gap:32px;padding-bottom:44px}
    .home-hero{padding:44px 0 0}
    .lead .l-side{border-top:1px solid var(--line);padding-top:28px}
    .briefing{grid-template-columns:1fr;gap:22px}
    .briefing input,.briefing .form,.tw-cta-form,.tw-cta-form input{width:100%}
    .tw-foot{flex-direction:column;align-items:flex-start}
    .thisweek{padding:26px 22px}
    .cor-grid,.ngrid{grid-template-columns:repeat(2,1fr)}
    .lists{grid-template-columns:1fr}
    .prow{grid-template-columns:1fr;gap:6px;padding:16px 0}
    .row{grid-template-columns:1fr}
    .row .r-meta{text-align:left}
    .trackrow{grid-template-columns:52px 1fr;gap:14px}
    .menu-toggle{display:block}
    nav.main{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:0;right:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:12px 20px 20px;display:none;box-shadow:0 14px 30px rgba(16,38,69,.12)}
    nav.main.open{display:flex}
    nav.main .navitem{width:100%}
    nav.main button.nav,nav.main a.nav{width:100%;justify-content:space-between;padding:11px 4px}
    .dropdown{position:static;display:block;box-shadow:none;border:0;border-radius:0;margin:0 0 4px 10px;padding:0;background:none}
    .briefing-btn{align-self:flex-start;margin-top:6px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const ARTICLES=[
 {id:"tariff",kind:"analysis",lead:true,beat:"Policy & Trade",corridors:["United States","India"],byline:"The Corridor Desk",dateline:"Washington",read:"8 min",
  head:"The tariff wall goes up this week. The medicines India actually sells America walk through a gap in it.",
  sf:"Section 232's universal deadline arrives Tuesday. Patented drugs and their ingredients face duties of up to 100 percent. What India ships is exempt, for now, and the 'for now' is doing a lot of work.",
  body:[
   "From Tuesday, the last of the exemptions run out. Section 232 duties on patented pharmaceuticals and the active ingredients that go into them reach every importer not already named on the government's accelerated list, closing a schedule that began on July 31 for seventeen large drugmakers. The headline rate is 100 percent. A branded product that crossed the border duty-free in the spring can, on paper, arrive on Wednesday costing twice what it did.",
   "Read the proclamation closely, though, and the thing that stands out for anyone watching the India corridor is what it leaves alone. Generic pharmaceuticals, biosimilars and their ingredients are not covered, not at a reduced rate, but excluded from the action for the time being. That is not a loophole India found. It is the design. And it is precisely the category that describes the overwhelming majority of what India ships into the United States: finished generic doses, the low-priced workhorses that fill American prescriptions rather than the patented molecules that fill drug-company earnings calls.",
   "So the immediate hit lands elsewhere. Commerce built its case on a plain finding: a little over half of the patented drugs sold in the United States are made abroad, and only about 15 percent of active ingredients are made domestically. The exposure that follows sits with branded manufacturers in Europe and, increasingly, with the companies scrambling to prove they are building at home. Country ceilings negotiated into trade deals soften it for some: the European Union, Japan, South Korea, and Switzerland and Liechtenstein land at 15 percent, the United Kingdom at 10, and two company-level routes cut deeper still. A Commerce-approved onshoring plan brings the rate to 20 percent, rising to the full 100 in April 2030. A most-favoured-nation pricing agreement with Washington takes it to zero through January 2029.",
   "For India the calculus is genuinely different, and more interesting than \u201cIndia dodged it.\u201d Two things sit underneath the reprieve. The first is that the exemption is explicitly provisional: Commerce is required, within a year of the April proclamation, to advise the President on whether to extend the tariffs to generics and their ingredients. The clock on that review is already running. The second is that India's escape from the finished-dose tariff does not clear its supply chain, because a large share of the ingredients underneath those doses originate in China, where the rate is not 15 or 20 percent but the unshielded top of the scale.",
   "The near-term reading, then, is that India's cost position into the US just improved relative to branded European competitors, and relative to anyone whose product carries a patent. That is a real, if narrow, opening, the kind a sharp commercial team presses now rather than later. The longer read is that the opening has an expiry date stamped on it, and that the same policy pushing branded capacity onto American soil is the policy that will decide, sometime in the next several months, whether the generic corridor stays open at today's terms.",
   "For an industry that spent two decades optimising purely on cost, the instruction now arriving from Washington is to optimise on geography as well. The corridor did not close this week. It got a deadline."
  ]},
 {id:"reshore",kind:"analysis",beat:"Manufacturing & Operations",corridors:["United States","Europe"],byline:"The Corridor Desk",dateline:"Indianapolis",read:"6 min",
  head:"America is pouring concrete. The hard part is the chemistry underneath.",
  sf:"More than $480 billion in announced US plants, and an active-ingredient gap that no new building closes by itself.",
  body:[
   "The scale of what has been announced is not in dispute. Since Eli Lilly opened the sequence in late February 2025 with a $27 billion commitment to four new domestic sites, the roll-call of pledges has grown to include most of the industry's largest names, and the totals have moved into territory with no real precedent. One tracker following the wave counts more than $480 billion committed by fourteen companies over the next four to ten years, spread across roughly twenty-two new manufacturing sites and some 44,000 promised jobs. Johnson & Johnson put its figure at more than $55 billion over four years. AstraZeneca set $50 billion through 2030, anchored by a drug-substance plant in Virginia it calls its largest single-site investment anywhere.",
   "A note of discipline is owed to those numbers before anyone builds a strategy on them. Headline commitments routinely bundle manufacturing with research and technology spending, and they stretch across many years, so they should not be read as cash going into new plants this quarter. They are statements of direction as much as budgets. What matters for the corridor is where the concrete is actually being poured, and there the direction is unusually clear.",
   "Look at what Lilly chose to build. Of the four sites it named, three are for active ingredients, an explicit attempt to bring small-molecule chemical synthesis back inside the country, and the fourth extends its injectable network. In September the company broke ground on a $6.5 billion plant in Houston, aimed largely at an oral GLP-1, with completion pencilled in around 2030. That last detail is the whole story of this build-out compressed into one date. A facility announced in 2025 and producing in 2030 tells you that reshoring is not a switch. It is a five-year civil-engineering project, and the demand it is chasing may look quite different by the time the lines are qualified.",
   "This is where the ingredient problem reasserts itself. Commerce's own finding, that only around 15 percent of active ingredients are made in the United States, is the gap all this capital is trying to close, and it is the hardest part of the chain to move, because the economics that drove chemical synthesis offshore in the first place have not changed. New buildings do not by themselves rebuild the upstream base of key starting materials and intermediates that the finished steps depend on.",
   "For the supplier ecosystem the corridor serves, the opportunity is immediate and concrete regardless of how the demand forecasts land. Every one of these plants needs bioreactors, single-use consumables, fill-finish lines, process instrumentation and the engineering firms to install them. The company that reads this wave correctly is not the one betting on which molecule sells in 2030. It is the one selling the equipment that every one of these sites needs before it can make anything at all."
  ]},
 {id:"quality",kind:"analysis",beat:"Quality & Regulatory",corridors:["India"],byline:"The Corridor Desk",dateline:"Mumbai",read:"7 min",
  head:"The problem in the file, not the tablet",
  sf:"Why India's quality story keeps tripping on documentation, and why market acceptance turns on fixing it.",
  body:[
   "When an FDA investigator at an Indian contract testing laboratory this year found preventive-maintenance forms already signed and dated for work not yet done, and a manager backdating analytical records to a date months in the past, the citation that followed was familiar in a way that ought to trouble the industry. The finished chemistry was not the issue. The record of it was. The warning letter to that Hyderabad laboratory, issued in March, noted that the non-contemporaneous recording of information was a repeat observation, cited across more than one inspection. It is a small case. It is also the whole pattern in miniature.",
   "Start with the scale that makes this matter. India is one of the two largest sources of the world's medicines and a foundation of the American generic supply, and the great majority of its facilities pass inspection without a warning letter. None of what follows is an argument that Indian manufacturing is unsafe. It is an argument about a specific, stubborn and disproportionate weakness, and about the fact that the people who buy from India know exactly where it lives.",
   "The weakness is data integrity. Across all FDA drug warning letters in fiscal 2025, integrity-related findings appeared in roughly 15 percent of cases, according to analysis of the agency's actions. For letters issued to Indian sites, the figure was closer to 60 percent. The gap is not new, and it is not narrowing quickly. Between 2022 and 2024 the FDA ran 114 surprise inspections at Indian facilities; 94 of them produced Form 483 observations. In the first quarter of this year alone, five Indian firms received warning letters that the agency framed not as sloppy paperwork but as deliberate falsification, in at least one instance involving records recreated for an investigator while the originals sat elsewhere in the building.",
   "Two things are changing the pressure. The first is volume: the FDA issued substantially more drug warning letters in fiscal 2025 than the year before, even while carrying dozens of unfilled investigator posts, which tells you the agency is targeting harder rather than inspecting more evenly. The second is method. The agency has put an internal analytical tool, which it calls Elsa, into wide use among its staff, using it to sift adverse-event data, past 483 observations and compliance anomalies to decide which facilities to visit. Risk-based targeting rewards a clean documentation history and punishes a patchy one, and it has a long memory.",
   "The reason this belongs at the centre of the corridor conversation, rather than in a compliance footnote, is that quality is the currency of market acceptance. An Indian manufacturer's cost advantage means nothing to a US or European buyer who cannot stand behind the data package. And the timing is pointed: with Washington due to decide within the year whether to extend tariffs to generics, the industry's argument for staying exempt rests partly on being seen as a reliable, well-documented supplier. Every falsified logbook is a line in the opposing brief. The fix is not more equipment. It is a culture in which the record matches what was done, the first time, every time, which is harder to build than a plant, and worth more."
  ]},
 {id:"pli",kind:"analysis",beat:"Supply Chain & Sourcing",corridors:["China","India"],byline:"The Corridor Desk",dateline:"New Delhi",read:"6 min",
  head:"India spent a fortune to cut the China cord. The cord got shorter and thicker.",
  sf:"Record PLI investment, and a dependence that deepened to 73.7 percent. The paradox, and what actually works.",
  body:[
   "Here is the paradox the latest government figures lay bare. India's production-linked incentive schemes for pharmaceuticals have, by the state's own accounting, worked: they have drawn \u20b946,744 crore of investment, exceeded their targets, and stood up domestic capacity that did not exist before. And over the same window, India's dependence on China for the chemical building blocks of its medicines did not fall. It rose, from 68.2 percent of the country's active-ingredient, key-starting-material and intermediate imports in 2020-21 to 73.7 percent by 2024-25, with the value of those Chinese imports climbing from \u20b918,646 crore to \u20b927,032 crore.",
   "Both facts are true at once, and holding them together is the beginning of understanding the corridor. The bulk-drug incentive scheme, backed by a \u20b96,940 crore outlay, has approved 48 projects; by June this year, thirty-nine of them, covering twenty-eight products, had been commissioned, and investment under the programme had passed \u20b95,210 crore. The government points, fairly, to 191 of 726 targeted ingredients now being made in India for the first time. This is not a policy that failed. It is a policy that ran straight into the reason the dependence exists.",
   "That reason sits at the bottom of the value chain, where it is least visible and hardest to move. Making a finished drug is a stacked process: key starting materials feed intermediates feed active ingredients feed the dose, and China's grip is tightest at the base of that stack, in the low-margin, effluent-heavy chemistry that Western and even Indian producers walked away from over two decades. India can stand up capacity for a named active ingredient and still buy the starting material for it from China. The Department of Pharmaceuticals told Parliament in March that China accounted for 70 percent or more of India's imports across a wide range of critical ingredients in both of the last two fiscal years.",
   "Price keeps the door open. Every time Indian capacity comes online in a product, Chinese suppliers have room to cut. Discounts of 40 to 50 percent have been reported in specific molecules, and a cost-driven generic industry with thin margins responds to price. Incentives can offset the gap for a while; they cannot repeal it. The fragility of the arrangement showed again in April, when an Indian industry body asked the government to help secure basic solvent feedstocks after inventories fell during the West Asia crisis, a reminder that the exposure runs all the way down to commodity chemicals.",
   "The honest conclusion is that self-sufficiency was the wrong target, and resilience is the right one. India is not going to make everything at home at a competitive price, and it does not need to. What the corridor needs is fewer single points of failure in the products where one disruption stops a medicine, and on that narrower, more achievable measure, the first plants are the beginning of an answer, not the end of one. The cord is still there. It is a question of how many strands, and how quickly they can be replaced when one is cut."
  ]},
 {id:"samsung",kind:"analysis",beat:"Deals & Capacity",corridors:["Rest of World","Europe","United States"],byline:"The Corridor Desk",dateline:"Songdo",read:"6 min",
  head:"While the West argues about where to build, Korea is buying the biologics high ground",
  sf:"Samsung Biologics' $262m deal, a $1.8bn Swiss acquisition, and a bet India's generic base largely doesn't make.",
  body:[
   "In the space of a few months, one South Korean company has signed a $262 million manufacturing agreement with an unnamed European drugmaker, moved to buy a Swiss peptide specialist for around $1.8 billion, raised roughly $2.2 billion from its shareholders to fund what comes next, and pushed its cumulative order book past $21.9 billion. Samsung Biologics is not reshoring, friend-shoring or waiting to see how the tariff schedule settles. It is consolidating a position, and the position is biologics contract manufacturing, the high-value end of the business India's generic base largely does not occupy.",
   "The physical footprint tells the story plainly. The company brought a fully automated fifth plant online at its second Songdo campus in 2025, taking capacity across its five Korean plants to 785,000 litres, and in March completed the purchase of a Rockville, Maryland site from GSK, adding 60,000 litres and its first manufacturing presence on American soil. That brings the global total to 845,000 litres, and it has already secured land for a third campus. On its own account it intends to bring plants six through eight online in sequence, roughly doubling capacity toward 1.385 million litres by 2032.",
   "Two of these moves matter more than their price tags. The Rockville acquisition gives a Korean CDMO a US base at the exact moment American policy is rewarding local manufacturing, a hedge written in concrete rather than contract language. And the pending purchase of the Swiss peptide maker points the company straight at the demand reshaping the whole industry: the GLP-1 obesity and diabetes drugs, several of which are peptides, and whose manufacturing needs are running ahead of available capacity. A biologics house buying peptide capability in 2026 is reading the same market Lilly is building four American plants to serve.",
   "The relevance to India's corridor is not that Samsung Biologics competes with Indian generics, largely, it does not. It is that the industry's fastest-growing, highest-margin manufacturing work is being locked up by companies making deliberate, capital-heavy bets on biologics, peptides and advanced modalities, while much of India's strength remains anchored in small-molecule chemistry. Korea is not the only one moving; Ireland, Singapore and others are building the same friend-shored, tariff-aware biologics capacity. The question the corridor should sit with is whether India's manufacturing base climbs the value chain toward this work, or supplies the world's medicines while the profit in making the newest ones is booked elsewhere. Capacity, in this business, is strategy made visible."
  ]}
];

 exports:{label:"Exports - where the chemistry goes",mode:"rows",src:"China's API exports run to tens of billions of dollars a year (about $35B in 2024; the China Chamber of Commerce put the first half of 2025 at $27.9B, up 3.8%), the total moving with how APIs and intermediates are counted. China does not report an export breakdown by destination, unlike India and the EU, so these rows show its weight in each market.",rows:[
  {name:"India",role:"the base's biggest customer",val:"~74% of India's API inputs",lead:true,detail:"India, the world's generic pharmacy, is China's single biggest pull. India sources about 74% of its active-ingredient and starting-material inputs from China, and up to 90% for key antibiotics. Every Indian generic shipped to the West sits, in part, on a Chinese chemical base."},
  {name:"Europe",role:"essential-medicine ingredients",val:"up to 95% of EU ibuprofen",detail:"A core market for bulk and specialty ingredients. Up to 95% of the ibuprofen used in the EU, and a large share of other essential-medicine inputs, originate in China."},
  {name:"United States",role:"the ingredient base",val:"45% of US FDA API filings",detail:"China holds the largest share of US active-ingredient registrations. Ingredients and generics are currently exempt from Section 232, but under the same one-year review as India's, while patented Chinese products sit at the top of the tariff scale."},

 profile:[
  {k:"Position",v:"The base of the global drug supply chain, dominant in key starting materials, intermediates and active ingredients. Also the world's <b>second-largest</b> pharma market and second-largest source of new drug candidates."},

  {k:"Biggest customers",v:"India, which sources about <b>74%</b> of its ingredients here, then Europe and the US for chemistry, and the West's biopharma for CDMO services."},
  {k:"The climb",v:"China has moved from about 23% (2023) to <b>30.5%</b> (2025) of the global innovative-drug pipeline, second only to the US, and its firms are licensing new drugs out to the world's largest pharma companies."},

 sources:"Share of global API production (~20%) and exports to 180+ countries: API industry analyses (APIFDF; OMR; Mantell). China's 45% share of US FDA active-ingredient registrations and H1 2025 exports ($27.93B, +3.8%; Belt and Road $7.75B Jan-May 2025): China Chamber of Commerce, via Blooming. Category dominance (paracetamol ~70%, key antibiotics 80%+, US/EU ibuprofen up to 95%): APIFDF; CIRSD. API export value (~$35B, 2024): Precedence Research. Second-largest pharma market (over $200B) and NRDL access (26 imported drugs, 2024): market research; Porsche Consulting. Innovative-drug pipeline (23% in 2023 to 30.5% in 2025): CIRSD. India's ~74% dependence: India Department of Pharmaceuticals. CDMO position and BIOSECURE (WuXi named June 2026; share falling to ~10% by 2030): BioSpace; Vision Life Sciences; GlobalData. Tariff terms: White House Proclamation 11020. Export value varies with how APIs and intermediates are counted, and China publishes no official export breakdown by destination, unlike India and the EU."};

  {big:"~50% / 15%",lbl:"of global pharma revenue is generated by the US industry, yet only ~15% of active ingredients are made at home.",src:"Commerce / industry"},
  {big:"$480B+",lbl:"of announced US manufacturing investment, 14 companies, ~22 new sites. The reshoring wave.",src:"2025 · onshoring tracker"}],
 imports:{label:"Imports - where the medicine comes from (2024, by value)",mode:"bars",src:"Shares by value, 2024. Which country ranks first depends on the measure: Ireland is first by value, on branded drugs and biologics; India first by the number of prescriptions filled; China first by shipment volume, on ingredients.",rows:[
  {name:"Ireland",val:"28.1% · $65.7B",pct:28.1,lead:true,detail:"The single largest source by value, and the one that drives the deficit. Ireland ships branded drugs and biologics, immunology and the GLP-1 boom above all, leaving the US with a roughly $37-47B pharmaceutical deficit with Dublin, its widest with any country."},
  {name:"Switzerland",val:"8.2% · $19.3B",pct:8.2,detail:"Roche and Novartis, high-value branded and biologic medicine. The second-largest deficit, about -$16B."},

  {name:"India",val:"~5% by value · #1 by generic volume",pct:5.4,detail:"Small by value, but the workhorse: India fills about 40% of all US generic prescriptions and leads every foreign supplier by generic volume. Its finished doses are the cheap base of the US system, currently duty-free under the Section 232 carve-out."},
  {name:"China, and the rest of the world",val:"EU collectively ~62%",pct:50.9,detail:"China leads by shipment volume as the source of the active ingredients under everyone else's medicine (45% of US FDA API filings). Singapore, Belgium, Italy, the UK and Japan make up the balance; the EU as a whole supplies about 62% of US pharma imports by value."}]},

 profile:[
  {k:"Position",v:"The world's largest pharmaceutical market and largest importer. Its industry generates about <b>50%</b> of global pharma revenue, yet only <b>15%</b> of active ingredients are made on US soil."},
  {k:"Flows in",v:"About <b>$234B</b> of imports in 2024, the largest of any country, from Ireland and Switzerland for branded drugs, India for generics, and China for the ingredients underneath."},
  {k:"Flows out",v:"About <b>$98B</b> of exports in 2025, the world's second-largest, patented and innovative medicine to 191 countries."},

let state={view:"home"};

/* ---------- shared renderers ---------- */
function tagline(beat,cors){
  return `<div class="tagline"><span class="tag-beat">${beat}</span>`+
    `<span class="tag-cor">${cors.map(c=>`<a onclick="event.stopPropagation();go({view:'corridor',value:'${c}'})">${c}</a>`).join('<span class="dot">·</span>')}</span></div>`;
}
function articleRow(a){
  return `<article class="row"><div class="r-body">${tagline(a.beat,a.corridors)}`+
    `<h3 onclick="openArticle('${a.id}')">${a.head}</h3><p class="sf">${a.sf}</p></div>`+
    `<div class="r-meta">${a.dateline} · ${a.read}</div></article>`;
}
function wireRow(n){
  return `<div class="trackrow"><div class="tdate">${n.date}</div><div class="tbody"><div class="thead">${n.head}</div><div class="tmeta">${n.source} · ${n.beat}</div></div></div>`;
}

/* ---------- home ---------- */
function renderHome(){
  const lead=ARTICLES.find(a=>a.lead), rest=ARTICLES.filter(a=>!a.lead);
  document.getElementById('cordrop').innerHTML=CORRIDORS.map(c=>`<a onclick="go({view:'corridor',value:'${c}'})">${c}<span class="co">${c==='India'?'lead':''}</span></a>`).join('');

  let h=`<section class="home-hero">
    <div class="lead"><div class="l-main">
      <span class="kindtag">Analysis · ${lead.beat}</span>
      <h1 onclick="openArticle('${lead.id}')">${lead.head}</h1>
      <p class="sf">${lead.sf}</p>
      <div class="meta">${lead.byline} · ${lead.dateline} · ${lead.read}</div>
    </div>
    <aside class="l-side">
      <div class="subhead"><span>On the wire</span><a onclick="go({view:'tracker'})">Tracker \u2192</a></div>
      ${NEWS.slice(0,5).map(n=>`<div class="side-item" onclick="go({view:'tracker'})"><h4>${n.head}</h4><div class="st">${n.date} · ${n.source}</div></div>`).join('')}
    </aside></div>
  </section>`;

  h+=`<section class="briefing" id="briefing"><div class="bt">
      <h3>The Corridor Briefing</h3>
      <p>One read that matters, assembled for your corridor and function. Free, most weekday mornings.</p>
    </div>
    <div class="form"><input type="email" placeholder="you@company.com" aria-label="Email"><button class="go">Subscribe</button></div>
  </section>`;

  h+=`<section><div class="sec-head"><span class="lbl">Latest analysis</span><span class="count"><a onclick="go({view:'list',type:'kind',value:'analysis'})">All analysis \u2192</a></span></div>`;
  rest.forEach(a=>h+=articleRow(a));
  h+=`</section>`;

  const tw=THISWEEK;
  h+=`<section style="padding-top:8px"><div class="thisweek">
      <div class="tw-head"><div><h3>This Week in the Corridor</h3><p class="tw-sub">The moves that mattered this week · Week of 29 Sep</p></div><span class="tw-badge">Weekly digest</span></div>
      <ol class="tw-list">
        ${tw.map((n,i)=>`<li class="tw-item" onclick="window.open('${n.href}','_blank','noopener')"><span class="tw-num">${String(i+1).padStart(2,'0')}</span><div><h5>${n.head}</h5><div class="tw-tags">${n.beat} · ${n.cors.join(' · ')}</div></div></li>`).join('')}
      </ol>
      <div class="tw-foot">
        <div class="tw-cta-form"><input type="email" placeholder="you@company.com" aria-label="Email"><button class="go">Get the weekly</button></div>
        <a class="tw-all" onclick="go({view:'tracker'})">See the full tracker \u2192</a>
      </div></div></section>`;

  h+=`<section class="corridors-block"><div class="lbl">Corridors</div><div class="cor-grid">`;
  CORRIDORS.forEach(c=>{
    const n=ARTICLES.filter(a=>a.corridors.includes(c)).length+NEWS.filter(x=>x.corridors.includes(c)).length;
    h+=`<div class="cor-cell" onclick="go({view:'corridor',value:'${c}'})"><div class="cname">${c}</div><div class="cmeta">${n} item${n===1?'':'s'}${c==='India'?' · lead corridor':''}</div></div>`;
  });
  h+=`</div></section>`;
  document.getElementById('app').innerHTML=h;
}

/* ---------- corridor page ---------- */
function flowBlock(f){
  let h=`<div class="flow"><div class="sec-lbl" style="margin:38px 0 4px">${f.label}</div>`;
  if(f.mode==='prose'){ h+=`<p class="prose">${f.prose}</p>`; }
  else {
    f.rows.forEach(r=>{
      const lead=r.lead?' lead':'';
      const role=r.role?`<span class="role">${r.role}</span>`:'';
      const bar=(f.mode==='bars')?`<div class="bar"><div class="fill" style="width:${r.pct}%"></div></div>`:'';
      const det=r.detail?`<div class="detail">${r.detail}</div>`:'';
      h+=`<div class="destrow${lead}"><div class="toprow"><span class="name">${r.name}${role}</span><span class="val">${r.val}</span></div>${bar}${det}</div>`;
    });
  }
  if(f.src) h+=`<div class="fsrc">${f.src}</div>`;
  h+=`</div>`; return h;
}
function renderCorridor(name){
  const p=CP[name]; if(!p){go({view:'home'});return;}
  const arts=ARTICLES.filter(a=>a.corridors.includes(name));
  const news=NEWS.filter(n=>n.corridors.includes(name));

  let h=`<section class="cpage"><div class="chead">
    <div class="crumb"><a onclick="go({view:'home'})">Home</a> / Corridors / ${name}</div>
    <h1 class="ctitle">${name}</h1>
    <p class="cstand">${p.stand}</p></div>`;

  h+=`<section class="numbers"><div class="sec-lbl">${p.variant==='bucket'?(name==='MENA'?'The region in numbers':'The region in numbers'):name+' in numbers'}</div><div class="ngrid">`;
  p.numbers.forEach(n=>h+=`<div class="ncell"><div class="big">${n.big}</div><div class="lbl">${n.lbl}</div><div class="src">${n.src}</div></div>`);
  h+=`</div></section>`;

  if(p.variant==='bucket'){ h+=flowBlock({...p.hubs,mode:'rows'}); }
  else { (p.flowOrder||['exports','imports']).forEach(k=>{ if(p[k]) h+=flowBlock(p[k]); }); }

  h+=`<div class="lists"><div class="lcol"><h4>Where it's made</h4>`;
  p.madeIn.forEach(m=>h+=`<div class="litem"><div class="nm">${m.nm}</div><div class="d">${m.d}</div></div>`);
  h+=`</div><div class="lcol"><h4>${p.whoTitle}</h4>`;
  p.who.forEach(w=>h+=`<div class="litem"><div class="nm">${w.nm}</div><div class="d">${w.d}</div></div>`);
  h+=`</div></div>`;

  h+=`<section class="cprofile"><div class="sec-lbl">How ${name==='United States'?'the US':name==='Rest of World'?'the':name+"'s"} corridor works</div>`;
  p.profile.forEach(r=>h+=`<div class="prow ${r.cls||''}"><div class="k">${r.k}</div><div class="v">${r.v}</div></div>`);
  h+=`</section>`;

  h+=`<section class="cprofile" style="margin-top:44px"><div class="sec-lbl">Latest from the ${name} corridor</div>`;
  if(arts.length){ arts.forEach(a=>h+=articleRow(a)); }
  else { h+=`<div class="cempty"><h3>Commissioned coverage lands with the next brief.</h3><p>This corridor is one we light up next with dedicated long-form. Until then, the wire tracks the moves.</p></div>`; }
  if(news.length){
    h+=`<div class="sec-lbl" style="margin:30px 0 4px">From the tracker</div><div class="tracker-list">`;
    news.forEach(n=>h+=wireRow(n)); h+=`</div>`;
  }
  h+=`</section>`;

  h+=`<div class="csources"><b>Sources.</b> ${p.sources}</div></section>`;
  document.getElementById('app').innerHTML=h; window.scrollTo({top:0});
}

/* ---------- tracker / analysis / article / about ---------- */
function renderTracker(){
  let activeBeat=state.beat||null;
  let items=[...NEWS]; if(activeBeat) items=items.filter(n=>n.beat===activeBeat);
  let h=`<div class="listing-head"><div class="crumb"><a onclick="go({view:'home'})">Home</a> / Latest</div>
      <h2>Industry Tracker</h2>
      <p class="desc">The corridor's daily wire, selected from 300-400 sources worldwide. We track everything; we publish what matters, and every item is tagged, so it flows to its corridor and beat automatically.</p>
      <div class="chips"><button class="chip ${!activeBeat?'on':''}" onclick="setBeat(null)">All</button>
      ${BEATS.map(b=>`<button class="chip ${activeBeat===b?'on':''}" onclick="setBeat('${b.replace(/'/g,"\\'")}')">${b}</button>`).join('')}</div></div>
    <div class="tracker-list">`;
  items.forEach(n=>h+=`<div class="trackrow"><div class="tdate">${n.date}</div><div class="tbody"><div class="thead">${n.head}</div><div class="tmeta">${n.source} · ${n.beat} · ${n.corridors.join(' · ')}</div></div></div>`);
  h+=`</div><div class="tracker-foot">Showing ${items.length} items, drawn from a much wider feed we filter down before it reaches the page.</div>`;
  document.getElementById('app').innerHTML=h; window.scrollTo({top:0});
}
function renderList(){
  let arts=ARTICLES.filter(a=>a.kind==='analysis');
  let activeBeat=state.beat||null; if(activeBeat) arts=arts.filter(a=>a.beat===activeBeat);
  let h=`<div class="listing-head"><div class="crumb"><a onclick="go({view:'home'})">Home</a> / Analysis</div>
      <h2>Analysis</h2><p class="desc">Long-form, bylined corridor analysis, the premium read.</p>
      <div class="chips"><button class="chip ${!activeBeat?'on':''}" onclick="setBeat(null)">All</button>
      ${BEATS.map(b=>`<button class="chip ${activeBeat===b?'on':''}" onclick="setBeat('${b.replace(/'/g,"\\'")}')">${b}</button>`).join('')}</div></div><div>`;
  arts.forEach(a=>h+=articleRow(a)); h+=`</div>`;
  document.getElementById('app').innerHTML=h; window.scrollTo({top:0});
}
function renderArticle(){
  const a=ARTICLES.find(x=>x.id===state.id);
  document.getElementById('app').innerHTML=`<article class="read">
    <a class="back" onclick="go(state.from||{view:'home'})">\u2190 Back</a>
    <span class="kindtag">Analysis · ${a.beat}</span>
    <h1>${a.head}</h1><p class="sf">${a.sf}</p>
    <div class="abyline">${a.byline} · ${a.dateline} · ${a.read}</div>
    <div class="body">${a.body.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="tags-foot">${tagline(a.beat,a.corridors)}</div></article>`;
  window.scrollTo({top:0});
}
function renderAbout(){
  const v=state.value;
  const copy={
    "Mission":"Pharma Corridor covers how the world makes medicine, the manufacturing, quality, supply and policy that move drugs between the places that make them and the places that need them. We over-index on India, where much of that work happens, and we report every corridor that connects to it.",
    "Editorial standards":"Sponsored content is always labelled and never bylined as editorial. Contributors disclose commercial interests. Every figure we publish is tied to a named, dated source. We correct errors promptly and visibly. Where the facts are unflattering to a company we cover, or that sponsors us, we publish them anyway. Independence is the reason the reporting is worth reading.",
    "Contribute":"We publish a small number of commissioned pieces from senior practitioners across the US, EU, MENA and India. If you lead quality, manufacturing, regulatory or supply for a corridor company, or advise those who do, write to the desk. We edit; we don't ghostwrite marketing.",
    "Corrections":"We post corrections here as they're made, with the date and what changed. If you've spotted an error, tell the desk and we'll look at it the same day."
  };
  document.getElementById('app').innerHTML=`<div class="listing-head"><div class="crumb"><a onclick="go({view:'home'})">Home</a> / About / ${v}</div><h2>${v}</h2></div>
    <div class="read" style="padding-top:34px"><div class="body"><p>${copy[v]||''}</p></div></div>`;
  window.scrollTo({top:0});
}

function go(s){state=s;render();closeMenus();}
function openArticle(id){state={view:'article',id,from:{...state}};render();closeMenus();}
function setBeat(b){state={...state,beat:b};render();}
function render(){const v=state.view;
  if(v==='home')renderHome();else if(v==='corridor')renderCorridor(state.value);
  else if(v==='tracker')renderTracker();else if(v==='list')renderList();
  else if(v==='article')renderArticle();else if(v==='about')renderAbout();}
function toggleDrop(id,e){e.stopPropagation();document.querySelectorAll('.navitem.open').forEach(n=>{if(n.id!==id)n.classList.remove('open')});document.getElementById(id).classList.toggle('open');}
function toggleMenu(){document.getElementById('mainnav').classList.toggle('open');}
function closeMenus(){document.querySelectorAll('.navitem.open').forEach(n=>n.classList.remove('open'));document.getElementById('mainnav').classList.remove('open');}
document.addEventListener('click',()=>document.querySelectorAll('.navitem.open').forEach(n=>n.classList.remove('open')));
render();
</script>
